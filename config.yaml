# ==============================================================================
# 全球宏观经济分析 Dashboard 核心配置文件 (config.yaml)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 全局配置与时间窗口设置
# ------------------------------------------------------------------------------
settings:
  title: "全球宏观经济与金融条件分析面板"
  subtitle: "Global Macroeconomic & Financial Conditions Intelligence Dashboard"
  monthly_window: 12       # 月度指标保留最新 12 个月
  quarterly_window: 8      # 季度指标保留最新 8 个季度
  daily_window: 365        # 高频指标保留最新 365 天

# ------------------------------------------------------------------------------
# 2. 四大核心经济体视觉规范 (国家/地区固定颜色)
# ------------------------------------------------------------------------------
entity_colors:
  US: "#1890FF"   # 🇺🇸 美国：蓝色
  CN: "#FF4D4F"   # 🇨🇳 中国：红色
  EZ: "#FAAD14"   # 🇪🇺 欧元区：金色/黄色
  JP: "#722ED1"   # 🇯🇵 日本：紫色
  GLOBAL: "#13C2C2" # 全球/综合：青色

# ------------------------------------------------------------------------------
# 3. AI 宏观分析引擎 Prompt 模版与生成结构 (配置 Gemma 4 26B 模型)
# ------------------------------------------------------------------------------
ai_analyst:
  model: "gemma-4-26b-a4b-it"   # 指定当前调通的 Gemma 4 26B 官方模型标识
  prompt_template: |
    你是一位顶尖的全球宏观经济学家与政治经济学（Political Economy）资深策略师。
    以下是系统刚提取的全球最新宏观经济与金融条件数据摘要（包含四大经济体、大宗商品及流动性指标）：

    【最新宏观数据摘要 JSON】
    {data_summary}

    请基于以上数据，遵循严密的逻辑传导链条（美联储政策 -> 实际利率/美元 -> 大宗商品 -> 输入型通胀 -> 国别政策 -> 实体经济），生成一份深度穿透式的全球宏观报告。

    你的回答必须**严格包含且仅包含**以下 4 个部分，用标准的 HTML 标签包裹输出：

    <div class="ai-macro-overview">
      <h3>一、 全球宏观周期总纲与核心定性</h3>
      <!-- 一段话精准提炼当前全球处于复苏、过热、滞胀还是衰退阶段，指出核心主导矛盾 -->
    </div>

    <div class="ai-module-analysis">
      <h3>二、 三大核心维度穿透式解读</h3>
      <h4>1. 全球流动性与金融条件</h4>
      <!-- 分析美元、实际利率对全球资本流向与信用环境的挤压 -->
      <h4>2. 四大经济体周期错位与政策收敛/发散</h4>
      <!-- 深入对比美、中、欧、日各自的需求、通胀与政策分化 -->
      <h4>3. 大宗商品、输入型通胀与实物需求</h4>
      <!-- 解读能源、金属与粮食价格对全球通胀及实物需求的映射 -->
    </div>

    <div class="ai-chart-insights">
      <h3>三、 关键指标边际变化微点评</h3>
      <!-- 挑选 3-4 个最新出现重要拐点或边际显著变化的指标，进行精准点评 -->
    </div>

    <div class="ai-summary-strategy">
      <h3>四、 总结与未来 1-2 个季度演绎展望</h3>
      <!-- 总结性预判 -->
    </div>

# ------------------------------------------------------------------------------
# 4. 图表与指标模块映射 (10 大核心图表模块，涵盖 22 个黄金指标)
# ------------------------------------------------------------------------------
charts:
  # === 模块 1：全球流动性与金融条件 ===
  - id: "chart_global_liquidity"
    title: "美元指数 vs 美国 10Y 实际利率 (全球资产定价之锚)"
    category: "liquidity"
    type: "dual_line"
    frequency: "daily"
    series:
      - name: "美元指数 (DXY)"
        source: "fred"
        code: "DTWEXBGS"
        axis: 0
        color: "#1890FF"
      - name: "美国 10Y 实际利率 (%)"
        source: "fred"
        code: "DFII10"
        axis: 1
        color: "#F5222D"

  - id: "chart_yield_curve"
    title: "美债 10Y-2Y 利差 (衰退与周期先行信号)"
    category: "liquidity"
    type: "area_zero"
    frequency: "daily"
    series:
      - name: "10Y-2Y 利差 (%)"
        source: "fred"
        code: "T10Y2Y"
        color: "#13C2C2"

  - id: "chart_financial_conditions"
    title: "芝加哥联储全国金融条件指数 (NFCI)"
    category: "liquidity"
    type: "line"
    frequency: "weekly"
    series:
      - name: "NFCI 指数"
        source: "fred"
        code: "NFCI"
        color: "#722ED1"

  # === 模块 2：四大经济体实体周期 ===
  - id: "chart_gdp_yoy"
    title: "四大经济体 GDP 同比增速 (%)"
    category: "national"
    type: "multi_line"
    frequency: "quarterly"
    series:
      - name: "美国"
        source: "fred"
        code: "A191RL1Q225SBEA"
        entity: "US"
      - name: "中国"
        source: "akshare"
        code: "macro_china_gdp_monthly"
        entity: "CN"
      - name: "欧元区"
        source: "fred"
        code: "CLVMNACSCAB1GQEA19"
        entity: "EZ"
      - name: "日本"
        source: "fred"
        code: "JPNRGDPEXP"
        entity: "JP"

  - id: "chart_cpi_yoy"
    title: "四大经济体 CPI 通胀同比 (%)"
    category: "national"
    type: "multi_line"
    frequency: "monthly"
    series:
      - name: "美国核心 CPI"
        source: "fred"
        code: "CPILFESL"
        entity: "US"
      - name: "中国 CPI"
        source: "akshare"
        code: "macro_china_cpi_monthly"
        entity: "CN"
      - name: "欧元区 CPI"
        source: "fred"
        code: "CP0000EZ19M086NEST"
        entity: "EZ"
      - name: "日本 CPI"
        source: "fred"
        code: "JPNCPIALLMINMEI"
        entity: "JP"

  - id: "chart_unemployment"
    title: "四大经济体失业率 (%)"
    category: "national"
    type: "multi_line"
    frequency: "monthly"
    series:
      - name: "美国"
        source: "fred"
        code: "UNRATE"
        entity: "US"
      - name: "欧元区"
        source: "fred"
        code: "LRHUTTTTEZM156S"
        entity: "EZ"
      - name: "日本"
        source: "fred"
        code: "LRHUTTTTJPM156S"
        entity: "JP"

  - id: "chart_china_credit"
    title: "中国社会融资规模与广义信用脉冲"
    category: "national"
    type: "bar_line"
    frequency: "monthly"
    series:
      - name: "社融新增规模 (亿元)"
        source: "akshare"
        code: "macro_china_shrf"
        type: "bar"
        color: "#FF4D4F"

  # === 模块 3：大宗商品与输入型通胀 ===
  - id: "chart_commodities_normalized"
    title: "核心大宗商品走势归一化对比 (基期=100)"
    category: "commodities"
    type: "normalized_line"
    frequency: "monthly"
    series:
      - name: "布伦特原油 (Brent)"
        source: "fred"
        code: "POILBREUSDM"
        color: "#FA8C16"
      - name: "伦铜 (Copper)"
        source: "fred"
        code: "PCOPPUSDM"
        color: "#1890FF"
      - name: "玉米 (Corn)"
        source: "fred"
