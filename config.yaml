  - id: "chart_risk_vix"
    title: "VIX 恐慌指数 (市场尾部情绪监测)"
    category: "sentiment"
    type: "line"
    frequency: "daily"
    series:
      - name: "VIX 指数"
        source: "fred"
        code: "VIXCLS"
        color: "#FF4D4F"